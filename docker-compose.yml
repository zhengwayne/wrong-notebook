services:
  wrong-notebook:
    image: ghcr.io/margrop/wrong-notebook:latest
    container_name: wrong-notebook
    restart: always
    ports:
      - "3000:3000"
    environment:
      # 可在部署目录的 .env 中设置完整访问地址
      - NEXTAUTH_URL
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in the deployment .env}
    volumes:
      # Persist the SQLite database
      - ./data:/app/data
      - ./config:/app/config

