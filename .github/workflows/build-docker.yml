name: Manual Docker Build & Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (default: manual)'
        required: false
        default: 'manual'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publication-check:
    runs-on: ubuntu-latest
    # 只在 GitHub 上运行；Gitea 读取 main 时会回退到本目录，需跳过
    if: github.server_url == 'https://github.com'
    name: Public History Check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check public history before continuing Docker build
        run: |
          python3 -m unittest discover -s tests/publication -v
          python3 scripts/check-public-history.py HEAD

  build-and-push:
    needs: publication-check
    runs-on: ubuntu-latest
    # 只在 GitHub 上运行；Gitea 读取 main 时会回退到本目录，需跳过
    if: github.server_url == 'https://github.com'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Reject latest tag for manual builds
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$INPUT_TAG" ] || [ "$INPUT_TAG" = "latest" ]; then
            echo "错误：手动构建禁止使用 'latest' 标签；latest 由正式版本标签发布流水线生成。" >&2
            exit 1
          fi
          if ! printf '%s' "$INPUT_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "错误：手动构建标签格式不合法，仅允许单个合法 Docker tag（禁止逗号、空白或其他注入字符）。" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # 需要标签来得出版本号

      - name: Resolve version from tags
        id: version
        run: echo "version=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"


      # Set up QEMU for multi-arch builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_REVISION=${{ github.sha }}
            TEST_TIMEOUT_MS=120000
          cache-from: type=gha
          cache-to: type=gha,mode=max
